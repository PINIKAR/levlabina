<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תודה שהצטרפת! | לב לבינה</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F8F5F1; /* צבע חול */
            font-family: 'Assistant', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #9CA18F; /* ירוק מרווה */
            margin-bottom: 20px;
        }
        p {
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background-color: #C5A059; /* זהב עמוק */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 10px auto;
            transition: transform 0.2s;
            max-width: 250px;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-secondary {
            background-color: #9CA18F; /* ירוק מרווה */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>איזה כיף, אנחנו יוצאות לדרך!</h1>
        <p>ההרשמה לסדנת המאסטר בוצעה בהצלחה. אני כבר מחכה לראות אותך בונה את סוכן ה-AI הראשון שלך בשיטת R.O.L.E.</p>
        
        <a href="קישור_לקבוצת_הוואטסאפ" class="btn">הצטרפות לקבוצה השקטה</a>
        <a href="קישור_לערכת_ההכנה" class="btn btn-secondary">הורדת ערכת ההכנה</a>
    </div>
</body>
</html>
